# BlockLords Phase 2 — Zahlen sind Startwerte; Schutz- und Zustimmungsinvarianten bleiben fest.
claims:
  radius-blocks: 48
  max-per-player: 4
  max-per-world: 20
  # Phase 1 erlaubt bewusst nur die erste Gründung. Die spätere Mehr-Dorf-Logik ist vorbereitet.
  multi-claim-enabled: false
  next-village-cost-emeralds: 64
  decay-block-days: 21

founding:
  require-quest: true
  # Wird genau einmal nach Abschluss der ersten Gründungsquest ausgegeben.
  starter-items:
    - "OAK_LOG:32"
    - "COBBLESTONE:64"
    - "BREAD:16"

decay:
  # false entspricht der bestätigten Config-Alternative "kein Zerfall".
  enabled: true
  warning-days: 10
  resting-days: 14
  check-interval-minutes: 30

database:
  file: "blocklords.db"
  backup-retention: 5

ui:
  use-bedrock-forms: true
  scan-cache-seconds: 60
  # Ein Scan arbeitet nur geladene Chunks ab; unvollständige Ergebnisse werden gekennzeichnet.
  chunks-per-tick: 1

residents:
  scan-interval-ticks: 200

workers:
  per-building: 2

missions:
  personal-offers: 2
  village-offers: 1
  offer-refresh-hours: 24
  targets:
    HOLZ_32: 32
    STEIN_32: 32
    BAUSTELLE_32: 32
    NAHRUNG_120: 120
  xp:
    HOLZ_32: 20
    STEIN_32: 20
    BAUSTELLE_32: 20
    NAHRUNG_120: 40

immigration:
  wait-seconds: 300
  retry-seconds: 60
  food-cost: 16
  first-xp: 30
  repeat-xp: 5
  check-ticks: 100

economy:
  storage-base-capacity: 1728
  storage-per-warehouse: 1728
  production-cycle-seconds: 300
  production-check-ticks: 1200
  active-window-minutes: 15
  offline-max-hours: 4
  offline-rate-percent: 50
  research-duration-seconds: 300

logging:
  # INFO: wichtige Aktionen und Fehler. DEBUG: zusätzlich Pakete, DB- und Queue-Details.
  level: INFO
  action-timeout-seconds: 20

debug: false
